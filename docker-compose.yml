services:
  postgres:
    image: postgres:14-alpine3.20
    container_name: postgres
    restart: unless-stopped
    volumes:
      - ./data/postgres/14/database_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:6.2-alpine3.20
    container_name: redis
    restart: unless-stopped
    volumes:
      - ./data/redis/database_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  greenlight-v3:
    image: ${GHCR_IMAGE:-ghcr.io/jessielung-design/greenlight}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION_TAG: ${IMAGE_TAG:-latest}
    container_name: greenlight-v3
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/greenlight-v3-production}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-please-change-me}
      BIGBLUEBUTTON_ENDPOINT: ${BIGBLUEBUTTON_ENDPOINT:-}
      BIGBLUEBUTTON_SECRET: ${BIGBLUEBUTTON_SECRET:-}
    ports:
      - "${GREENLIGHT_PORT:-5050}:3000"
    logging:
      driver: ${LOGGING_DRIVER:-json-file}
    volumes:
      - ./data/greenlight-v3/storage:/usr/src/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
